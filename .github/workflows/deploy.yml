name: Deploy to Production

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main

env:
  APP_ENV: prod
  PHP_VERSION: 8.2

jobs:
  test:
    name: Tests & Quality Checks
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sirius_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, intl, mbstring, xml
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Copy .env file
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql://app:password@localhost:5432/sirius_test?serverVersion=16&charset=utf8" >> .env

      - name: Generate APP_SECRET
        run: echo "APP_SECRET=$(openssl rand -base64 32)" >> .env

      - name: Create database
        run: php bin/console doctrine:database:create --env=test

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHP-CS-Fixer
        run: |
          composer require --dev friendsofphp/php-cs-fixer --no-interaction || true
          php vendor/bin/php-cs-fixer fix --dry-run --diff || true

      - name: Run PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-interaction || true
          php vendor/bin/phpstan analyse src/ || true

      - name: Run tests
        run: php bin/phpunit || true

      - name: Check Symfony configuration
        run: php bin/console lint:container

      - name: Check Twig templates
        run: php bin/console lint:twig templates/

      - name: Check YAML files
        run: php bin/console lint:yaml config/ translations/

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/sirius-solar:latest
            ${{ secrets.DOCKER_USERNAME }}/sirius-solar:${{ github.sha }}

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            cd /var/www/sirius-solar

            # Pull latest code
            git fetch origin
            git checkout main
            git pull origin main

            # Backup database before deploy
            ./backup.sh

            # Deploy with Docker
            docker-compose -f docker-compose.prod.yaml pull
            docker-compose -f docker-compose.prod.yaml up -d
            docker-compose -f docker-compose.prod.yaml exec web php bin/console doctrine:migrations:migrate --no-interaction
            docker-compose -f docker-compose.prod.yaml exec web php bin/console asset-map:compile
            docker-compose -f docker-compose.prod.yaml exec web php bin/console cache:clear --env=prod

            # Verify deployment
            sleep 5
            curl -f http://localhost:8000/health || exit 1

  notify:
    name: Notify Slack
    needs: [test, build, deploy]
    runs-on: ubuntu-22.04
    if: always()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "🚀 Deployment Status: ${{ needs.deploy.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Sirius-Solar Deployment*\nBranch: ${{ github.ref }}\nCommit: ${{ github.sha }}\nStatus: ${{ needs.deploy.result }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
