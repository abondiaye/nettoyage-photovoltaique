<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8e6cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#88d8c0;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#mapGradient)"/>

  <!-- Map base -->
  <path d="M 50 100 Q 150 50 250 100 T 450 100 L 500 200 Q 450 300 300 350 Q 150 300 100 200 Z"
        fill="#0A3D35" opacity="0.3" filter="url(#shadow)"/>

  <!-- Lake/water -->
  <circle cx="150" cy="200" r="60" fill="#2D6B55" opacity="0.4"/>
  <circle cx="400" cy="180" r="45" fill="#2D6B55" opacity="0.3"/>

  <!-- Solar farm locations (pin markers) -->
  <g filter="url(#shadow)">
    <!-- Pin 1 -->
    <circle cx="180" cy="140" r="8" fill="#D4A842"/>
    <circle cx="180" cy="140" r="6" fill="#f4d03f" opacity="0.8"/>
    <path d="M 180 155 L 175 170 L 185 170 Z" fill="#D4A842"/>

    <!-- Pin 2 -->
    <circle cx="320" cy="200" r="8" fill="#D4A842"/>
    <circle cx="320" cy="200" r="6" fill="#f4d03f" opacity="0.8"/>
    <path d="M 320 215 L 315 230 L 325 230 Z" fill="#D4A842"/>

    <!-- Pin 3 -->
    <circle cx="420" cy="120" r="8" fill="#D4A842"/>
    <circle cx="420" cy="120" r="6" fill="#f4d03f" opacity="0.8"/>
    <path d="M 420 135 L 415 150 L 425 150 Z" fill="#D4A842"/>

    <!-- Pin 4 -->
    <circle cx="250" cy="280" r="8" fill="#D4A842"/>
    <circle cx="250" cy="280" r="6" fill="#f4d03f" opacity="0.8"/>
    <path d="M 250 295 L 245 310 L 255 310 Z" fill="#D4A842"/>
  </g>

  <!-- Roads/connections -->
  <g stroke="#F0F4F8" stroke-width="3" opacity="0.5">
    <path d="M 100 150 Q 200 180 300 200"/>
    <path d="M 300 200 Q 350 150 450 120"/>
    <path d="M 300 200 Q 280 240 250 280"/>
  </g>

  <!-- Title -->
  <text x="300" y="40" font-size="28" font-weight="bold" text-anchor="middle" fill="#0A3D35" font-family="Arial">Zone d'intervention</text>
  <text x="300" y="365" font-size="14" text-anchor="middle" fill="#0A3D35" font-family="Arial">Services disponibles en Suisse Romande</text>

  <!-- Legend -->
  <g>
    <circle cx="480" cy="340" r="5" fill="#D4A842"/>
    <text x="495" y="345" font-size="12" fill="#0A3D35" font-family="Arial">Installation cliente</text>
  </g>
</svg>
