<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A3D35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6B55;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#greenGrad)" opacity="0.15"/>

  <!-- Sun (larger and more prominent) -->
  <circle cx="100" cy="70" r="45" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Sun rays (thicker and more prominent) -->
  <g stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Top -->
    <line x1="100" y1="15" x2="100" y2="-5"/>
    <!-- Top-right -->
    <line x1="142" y1="28" x2="160" y2="10"/>
    <!-- Right -->
    <line x1="160" y1="70" x2="190" y2="70"/>
    <!-- Bottom-right -->
    <line x1="142" y1="112" x2="160" y2="130"/>
    <!-- Top-left -->
    <line x1="58" y1="28" x2="40" y2="10"/>
    <!-- Left -->
    <line x1="40" y1="70" x2="10" y2="70"/>
    <!-- Bottom-left -->
    <line x1="58" y1="112" x2="40" y2="130"/>
  </g>

  <!-- Inner sun bright core -->
  <circle cx="100" cy="70" r="38" fill="none" stroke="url(#sunGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Innermost sun glow -->
  <circle cx="100" cy="70" r="32" fill="#FFEB3B" opacity="0.4"/>

  <!-- Left solar panel - large and visible -->
  <g filter="url(#glow)">
    <rect x="30" y="130" width="50" height="50" rx="8" fill="url(#greenGrad)" opacity="0.9" stroke="url(#sunGrad)" stroke-width="2"/>
    <!-- Panel grid lines -->
    <line x1="30" y1="155" x2="80" y2="155" stroke="url(#sunGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="55" y1="130" x2="55" y2="180" stroke="url(#sunGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Right solar panel - large and visible -->
  <g filter="url(#glow)">
    <rect x="120" y="130" width="50" height="50" rx="8" fill="url(#greenGrad)" opacity="0.9" stroke="url(#sunGrad)" stroke-width="2"/>
    <!-- Panel grid lines -->
    <line x1="120" y1="155" x2="170" y2="155" stroke="url(#sunGrad)" stroke-width="1.5" opacity="0.6"/>
    <line x1="145" y1="130" x2="145" y2="180" stroke="url(#sunGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Connection line between panels -->
  <line x1="80" y1="155" x2="120" y2="155" stroke="url(#sunGrad)" stroke-width="3" opacity="0.8"/>
</svg>
