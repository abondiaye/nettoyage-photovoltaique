<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A3D35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6B55;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- LEFT GEAR -->
  <g filter="url(#shadow)">
    <!-- Outer circle -->
    <circle cx="80" cy="100" r="55" fill="url(#greenGrad)" stroke="#0A3D35" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="80" cy="100" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Center dot -->
    <circle cx="80" cy="100" r="8" fill="url(#goldGrad)"/>

    <!-- Gear teeth left side (top-left rays) -->
    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="65" x2="30" y2="45"/>
      <line x1="55" y1="60" x2="40" y2="35"/>
      <line x1="65" y1="58" x2="55" y2="30"/>
      <line x1="78" y1="56" x2="78" y2="20"/>
    </g>

    <!-- Gear teeth middle-bottom rays -->
    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="100" y1="155" x2="100" y2="190"/>
      <line x1="92" y1="157" x2="85" y2="195"/>
      <line x1="82" y1="152" x2="70" y2="195"/>
      <line x1="70" y1="147" x2="50" y2="185"/>
    </g>

    <!-- Gear teeth right side -->
    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="110" y1="147" x2="130" y2="185"/>
      <line x1="120" y1="152" x2="145" y2="195"/>
      <line x1="128" y1="157" x2="160" y2="195"/>
      <line x1="135" y1="155" x2="170" y2="180"/>
    </g>
  </g>

  <!-- RIGHT GEAR (slightly lower) -->
  <g filter="url(#shadow)" transform="translate(140, 20)">
    <!-- Outer circle -->
    <circle cx="80" cy="100" r="55" fill="url(#greenGrad)" stroke="#0A3D35" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="80" cy="100" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
    <!-- Center dot -->
    <circle cx="80" cy="100" r="8" fill="url(#goldGrad)"/>

    <!-- Gear teeth (similar pattern) -->
    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="50" y1="65" x2="30" y2="45"/>
      <line x1="55" y1="60" x2="40" y2="35"/>
      <line x1="78" y1="56" x2="78" y2="20"/>
    </g>

    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="100" y1="155" x2="100" y2="190"/>
      <line x1="92" y1="157" x2="85" y2="195"/>
      <line x1="82" y1="152" x2="70" y2="195"/>
    </g>

    <g stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round">
      <line x1="110" y1="147" x2="130" y2="185"/>
      <line x1="120" y1="152" x2="145" y2="195"/>
      <line x1="128" y1="157" x2="160" y2="195"/>
    </g>
  </g>

  <!-- CONNECTING LINE -->
  <line x1="140" y1="100" x2="220" y2="100" stroke="url(#greenGrad)" stroke-width="5" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- RIGHT CONNECTOR CURVE -->
  <path d="M 220 100 Q 240 90 260 100" stroke="url(#greenGrad)" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#shadow)"/>

  <!-- GOLD STAR (top right) -->
  <g filter="url(#shadow)">
    <path d="M 360 50 L 368 72 L 392 72 L 373 87 L 381 109 L 360 94 L 339 109 L 347 87 L 328 72 L 352 72 Z"
          fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>

  <!-- TEXT: SIRIUS -->
  <text x="420" y="90" font-family="Arial, sans-serif" font-size="56" font-weight="bold"
        fill="url(#greenGrad)" letter-spacing="3" filter="url(#shadow)">
    SIRIUS
  </text>

  <!-- TEXT: -SOLAR -->
  <text x="420" y="140" font-family="Arial, sans-serif" font-size="52" font-weight="bold"
        fill="url(#goldGrad)" letter-spacing="2" filter="url(#shadow)" font-style="italic">
    -SOLAR
  </text>
</svg>
