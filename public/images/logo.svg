<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4d03f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A3D35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6B55;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="190" fill="url(#greenGradient)" opacity="0.1"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="url(#greenGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Sun -->
  <circle cx="200" cy="140" r="50" fill="url(#sunGradient)" filter="url(#shadow)"/>

  <!-- Sun rays -->
  <g stroke="url(#sunGradient)" stroke-width="6" stroke-linecap="round" filter="url(#shadow)">
    <!-- Top ray -->
    <line x1="200" y1="70" x2="200" y2="20"/>
    <!-- Top-right ray -->
    <line x1="265" y1="90" x2="305" y2="50"/>
    <!-- Right ray -->
    <line x1="290" y1="140" x2="340" y2="140"/>
    <!-- Bottom-right ray -->
    <line x1="265" y1="190" x2="305" y2="230"/>
    <!-- Top-left ray -->
    <line x1="135" y1="90" x2="95" y2="50"/>
    <!-- Left ray -->
    <line x1="110" y1="140" x2="60" y2="140"/>
    <!-- Bottom-left ray -->
    <line x1="135" y1="190" x2="95" y2="230"/>
  </g>

  <!-- Inner sun glow -->
  <circle cx="200" cy="140" r="45" fill="none" stroke="url(#sunGradient)" stroke-width="2" opacity="0.5"/>

  <!-- Solar panel wheels/turbines effect -->
  <g filter="url(#shadow)">
    <!-- Left panel wheel -->
    <circle cx="120" cy="260" r="35" fill="url(#greenGradient)" opacity="0.8"/>
    <circle cx="120" cy="260" r="32" fill="none" stroke="url(#sunGradient)" stroke-width="2"/>

    <!-- Turbine blades left -->
    <g stroke="url(#sunGradient)" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="225" x2="120" y2="190"/>
      <line x1="155" y1="260" x2="190" y2="260"/>
      <line x1="120" y1="295" x2="120" y2="330"/>
      <line x1="85" y1="260" x2="50" y2="260"/>
    </g>

    <!-- Right panel wheel -->
    <circle cx="280" cy="260" r="35" fill="url(#greenGradient)" opacity="0.8"/>
    <circle cx="280" cy="260" r="32" fill="none" stroke="url(#sunGradient)" stroke-width="2"/>

    <!-- Turbine blades right -->
    <g stroke="url(#sunGradient)" stroke-width="3" stroke-linecap="round">
      <line x1="280" y1="225" x2="280" y2="190"/>
      <line x1="315" y1="260" x2="350" y2="260"/>
      <line x1="280" y1="295" x2="280" y2="330"/>
      <line x1="245" y1="260" x2="210" y2="260"/>
    </g>
  </g>

  <!-- Connection line between panels -->
  <line x1="155" y1="260" x2="245" y2="260" stroke="url(#sunGradient)" stroke-width="3" opacity="0.6" filter="url(#shadow)"/>

  <!-- Stars/sparkles -->
  <g fill="url(#sunGradient)" filter="url(#shadow)">
    <!-- Top star -->
    <path d="M 200 8 L 205 20 L 218 20 L 208 28 L 213 40 L 200 32 L 187 40 L 192 28 L 182 20 L 195 20 Z" fill="url(#sunGradient)"/>

    <!-- Right star -->
    <path d="M 355 140 L 360 150 L 372 150 L 362 158 L 367 170 L 355 162 L 343 170 L 348 158 L 338 150 L 350 150 Z" fill="url(#sunGradient)"/>
  </g>

  <!-- Text: SIRIUS -->
  <text x="200" y="360" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#greenGradient)" font-family="Arial, sans-serif" letter-spacing="2">SIRIUS</text>

  <!-- Text: -SOLAR -->
  <text x="200" y="385" font-size="36" font-weight="bold" text-anchor="middle" fill="url(#sunGradient)" font-family="Arial, sans-serif" letter-spacing="1">-SOLAR</text>

  <!-- Decorative dots -->
  <circle cx="85" cy="365" r="3" fill="url(#sunGradient)"/>
  <circle cx="315" cy="365" r="3" fill="url(#sunGradient)"/>
</svg>
