<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A842;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f4d03f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="panelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A3D35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D6B55;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#panelGradient)" opacity="0.1" stroke="url(#panelGradient)" stroke-width="2"/>

  <!-- Sun -->
  <circle cx="100" cy="80" r="35" fill="url(#sunGradient)"/>

  <!-- Sun rays -->
  <g stroke="url(#sunGradient)" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="30" x2="100" y2="10"/>
    <line x1="140" y1="40" x2="155" y2="25"/>
    <line x1="150" y1="80" x2="170" y2="80"/>
    <line x1="140" y1="120" x2="155" y2="135"/>
  </g>

  <!-- Solar panels -->
  <g fill="url(#panelGradient)" opacity="0.8">
    <rect x="60" y="130" width="25" height="30" rx="2"/>
    <rect x="90" y="135" width="25" height="30" rx="2"/>
    <rect x="120" y="130" width="25" height="30" rx="2"/>
  </g>

  <!-- Panel shine -->
  <g stroke="url(#sunGradient)" stroke-width="1" opacity="0.6">
    <line x1="62" y1="132" x2="83" y2="132"/>
    <line x1="92" y1="137" x2="113" y2="137"/>
    <line x1="122" y1="132" x2="143" y2="132"/>
  </g>

  <!-- Text -->
  <text x="100" y="185" font-size="14" font-weight="bold" text-anchor="middle" fill="url(#panelGradient)" font-family="Arial">SIRIUS-SOLAR</text>
</svg>
