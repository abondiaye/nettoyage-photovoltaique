<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D6B55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A3D35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4A842;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="145" fill="rgba(255,255,255,0.05)" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>

  <!-- LEFT GEAR - LARGE -->
  <g filter="url(#shadow)">
    <!-- Outer circle -->
    <circle cx="100" cy="130" r="65" fill="url(#greenGrad)" stroke="#0A3D35" stroke-width="3"/>

    <!-- Inner bright circle -->
    <circle cx="100" cy="130" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Center bright dot -->
    <circle cx="100" cy="130" r="12" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Gear teeth - LEFT SIDE -->
    <g stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="55" y1="75" x2="35" y2="50" opacity="0.9"/>
      <line x1="48" y1="68" x2="25" y2="40" opacity="0.85"/>
      <line x1="42" y1="65" x2="15" y2="35"/>
    </g>

    <!-- Gear teeth - RIGHT SIDE -->
    <g stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="145" y1="75" x2="165" y2="50" opacity="0.9"/>
      <line x1="152" y1="68" x2="175" y2="40" opacity="0.85"/>
      <line x1="158" y1="65" x2="185" y2="35"/>
    </g>

    <!-- Gear teeth - BOTTOM -->
    <g stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="65" y1="185" x2="45" y2="220" opacity="0.9"/>
      <line x1="85" y1="195" x2="70" y2="235" opacity="0.85"/>
      <line x1="100" y1="198" x2="100" y2="240"/>
      <line x1="115" y1="195" x2="130" y2="235" opacity="0.85"/>
      <line x1="135" y1="185" x2="155" y2="220" opacity="0.9"/>
    </g>
  </g>

  <!-- RIGHT GEAR - SLIGHTLY OFFSET -->
  <g filter="url(#shadow)" transform="translate(80, 30)">
    <!-- Outer circle -->
    <circle cx="100" cy="130" r="65" fill="url(#greenGrad)" stroke="#0A3D35" stroke-width="3"/>

    <!-- Inner bright circle -->
    <circle cx="100" cy="130" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#glow)"/>

    <!-- Center bright dot -->
    <circle cx="100" cy="130" r="12" fill="url(#goldGrad)" filter="url(#glow)"/>

    <!-- Gear teeth simplified -->
    <g stroke="url(#greenGrad)" stroke-width="8" stroke-linecap="round">
      <line x1="55" y1="75" x2="35" y2="50" opacity="0.9"/>
      <line x1="48" y1="68" x2="25" y2="40" opacity="0.85"/>
      <line x1="100" y1="198" x2="100" y2="240"/>
      <line x1="145" y1="75" x2="165" y2="50" opacity="0.9"/>
    </g>
  </g>

  <!-- GOLD STAR - TOP RIGHT (BRIGHT) -->
  <g filter="url(#glow)">
    <circle cx="220" cy="70" r="25" fill="url(#goldGrad)" opacity="0.9"/>
    <path d="M 220 50 L 226 68 L 245 68 L 230 78 L 236 96 L 220 86 L 204 96 L 210 78 L 195 68 L 214 68 Z"
          fill="#FFD700" stroke="url(#goldGrad)" stroke-width="1.5"/>
  </g>

  <!-- CONNECTING LINE -->
  <line x1="170" cy="130" x2="210" y2="130" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- DECORATIVE CURVE/HOOK on right -->
  <path d="M 210 130 Q 235 120 250 135" stroke="url(#greenGrad)" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#shadow)" opacity="0.8"/>

  <!-- GRADIENT BACKGROUND RING -->
  <defs>
    <radialGradient id="bgGrad">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0A3D35;stop-opacity:0.05" />
    </radialGradient>
  </defs>
  <circle cx="150" cy="150" r="140" fill="url(#bgGrad)" opacity="0.6"/>
</svg>
