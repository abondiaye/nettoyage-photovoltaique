<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary metallic gradient with more depth -->
    <radialGradient id="metalGradient" cx="38%" cy="32%" r="70%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="10%" style="stop-color:#f9f9f9;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#ececec;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#d5d5d5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b0b0b0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#808080;stop-opacity:1" />
      <stop offset="90%" style="stop-color:#606060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#505050;stop-opacity:1" />
    </radialGradient>

    <!-- Top highlight -->
    <radialGradient id="topShine" cx="42%" cy="28%" r="55%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="30%" style="stop-color:#ffffff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- Side highlight -->
    <radialGradient id="sideShine" cx="25%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>

    <!-- Bottom shadow -->
    <radialGradient id="bottomShadow" cx="50%" cy="75%" r="60%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Outer dark ring (border) -->
  <circle cx="100" cy="100" r="99" fill="none" stroke="#0a0a0a" stroke-width="11"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Metal base with primary gradient -->
  <circle cx="100" cy="100" r="88" fill="url(#metalGradient)"/>

  <!-- Bottom shadow for depth -->
  <circle cx="100" cy="100" r="88" fill="url(#bottomShadow)"/>

  <!-- Concentric circles texture - like vinyl record grooves -->
  <g opacity="0.35" stroke="#555555" stroke-width="0.7" fill="none">
    <!-- Dense concentric circles from center outward -->
    <circle cx="100" cy="100" r="10" />
    <circle cx="100" cy="100" r="14" />
    <circle cx="100" cy="100" r="18" />
    <circle cx="100" cy="100" r="22" />
    <circle cx="100" cy="100" r="26" />
    <circle cx="100" cy="100" r="30" />
    <circle cx="100" cy="100" r="34" />
    <circle cx="100" cy="100" r="38" />
    <circle cx="100" cy="100" r="42" />
    <circle cx="100" cy="100" r="46" />
    <circle cx="100" cy="100" r="50" />
    <circle cx="100" cy="100" r="54" />
    <circle cx="100" cy="100" r="58" />
    <circle cx="100" cy="100" r="62" />
    <circle cx="100" cy="100" r="66" />
    <circle cx="100" cy="100" r="70" />
    <circle cx="100" cy="100" r="74" />
    <circle cx="100" cy="100" r="78" />
    <circle cx="100" cy="100" r="82" />
  </g>

  <!-- Even denser secondary circle layer -->
  <g opacity="0.2" stroke="#666666" stroke-width="0.4" fill="none">
    <circle cx="100" cy="100" r="12" />
    <circle cx="100" cy="100" r="16" />
    <circle cx="100" cy="100" r="20" />
    <circle cx="100" cy="100" r="24" />
    <circle cx="100" cy="100" r="28" />
    <circle cx="100" cy="100" r="32" />
    <circle cx="100" cy="100" r="36" />
    <circle cx="100" cy="100" r="40" />
    <circle cx="100" cy="100" r="44" />
    <circle cx="100" cy="100" r="48" />
    <circle cx="100" cy="100" r="52" />
    <circle cx="100" cy="100" r="56" />
    <circle cx="100" cy="100" r="60" />
    <circle cx="100" cy="100" r="64" />
    <circle cx="100" cy="100" r="68" />
    <circle cx="100" cy="100" r="72" />
    <circle cx="100" cy="100" r="76" />
    <circle cx="100" cy="100" r="80" />
    <circle cx="100" cy="100" r="84" />
  </g>

  <!-- Top specular highlight - primary -->
  <ellipse cx="58" cy="48" rx="28" ry="24" fill="url(#topShine)"/>

  <!-- Secondary top highlight -->
  <ellipse cx="75" cy="40" rx="18" ry="14" fill="#ffffff" opacity="0.25"/>

  <!-- Side highlight for dimension -->
  <ellipse cx="32" cy="100" rx="20" ry="35" fill="url(#sideShine)"/>

  <!-- Center bright spot -->
  <circle cx="100" cy="100" r="14" fill="#ffffff" opacity="0.12"/>

  <!-- Indicator pointer at 12 o'clock -->
  <g>
    <!-- Left edge shadow -->
    <rect x="94" y="28" width="2.5" height="80" fill="#333333" opacity="0.6" rx="1.25"/>
    <!-- Main pointer body -->
    <rect x="96.5" y="28" width="7" height="80" fill="#ffffff" opacity="0.97" rx="3.5"/>
    <!-- Right edge highlight -->
    <rect x="103.5" y="28" width="2.5" height="80" fill="#ffffff" opacity="0.6" rx="1.25"/>
    <!-- Rounded top -->
    <circle cx="100" cy="30" r="4" fill="#ffffff" opacity="0.97"/>
  </g>

  <!-- Inner ring shadow for 3D depth -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#000000" stroke-width="3" opacity="0.12"/>

  <!-- Outer rim highlight -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
</svg>
