services_page:
  title: Unsere professionellen Dienstleistungen
  subtitle: Entdecken Sie unsere umfassenden Reinigungslösungen für Photovoltaikanlagen

  service1:
    title: Hochdruck-Reinigung
    desc: Professionelle Reinigung mit Osmosewasser und Hochdruckausrüstung zur Beseitigung aller Verschmutzungen.
    feature1: 100% reines Osmosewasser
    feature2: Keine Chemikalien
    feature3: Ökologische Technologie
    feature4: Garantierte Ertragssteigerung von +25%

  service2:
    title: Vollständige Inspektion
    desc: Detaillierte professionelle Diagnose Ihrer Solaranlagen mit vollständigem Fotobericht.
    feature1: Detaillierter Bericht inbegriffen
    feature2: Hochauflösende Fotos
    feature3: Personalisierte Empfehlungen
    feature4: Kostenlos für Sirius-Kunden

  service3:
    title: Regelmäßige Wartung
    desc: Maßgeschneiderte Wartungsverträge zur Sicherung optimaler Leistung das ganze Jahr über.
    feature1: Monatliche/vierteljährliche Reinigungen
    feature2: Echtzeit-Überwachung
    feature3: Bevorzugte Tarife
    feature4: Vorrangestellte Interventionen

  service4:
    title: Schutz & Versiegelung
    desc: Anwendung ökologischer Schutzprodukte zur Verlängerung der Lebensdauer Ihrer Anlagen.
    feature1: 18 Monate Schutz
    feature2: Reduziert Verschmutzung
    feature3: Silikonfreie Formel
    feature4: Zertifiziert ökologisch

  service5:
    title: Leistungsanalyse
    desc: Detaillierte Analyse der Anlagenleistung mit Optimierungsvorschlägen.
    feature1: Produktionsdaten
    feature2: Normvergleiche
    feature3: Verbesserungsplan
    feature4: Monatliche Überwachung inbegriffen

  service6:
    title: Notfalleinsatz
    desc: Schneller 24/7-Service für Notfälle und kritische Probleme.
    feature1: Antwort innerhalb von 2 Stunden
    feature2: 24/7-Verfügbarkeit
    feature3: Erfahrene Techniker
    feature4: Transparente Preise

