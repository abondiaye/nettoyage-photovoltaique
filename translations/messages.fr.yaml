services_page:
  title: Nos Services Professionnels
  subtitle: Découvrez nos solutions complètes de nettoyage et d'entretien pour panneaux photovoltaïques

  service1:
    title: Nettoyage Haute Pression
    desc: Nettoyage professionnel avec eau osmosée et équipement haute pression pour éliminer toute saleté et dépôt.
    feature1: Eau osmosée 100% pure
    feature2: Zéro produit chimique
    feature3: Technologie écologique
    feature4: Rendement +25% garanti

  service2:
    title: Inspection Complète
    desc: Diagnostic professionnel détaillé de vos installations solaires avec rapport photographique complet.
    feature1: Rapport détaillé inclus
    feature2: Photos haute résolution
    feature3: Recommandations personnalisées
    feature4: Gratuit pour clients Sirius

  service3:
    title: Maintenance Régulière
    desc: Contrats d'entretien personnalisés pour garantir une performance optimale de vos panneaux toute l'année.
    feature1: Nettoyages mensuels/trimestriels
    feature2: Suivi en temps réel
    feature3: Tarifs préférentiels
    feature4: Priorité interventions

  service4:
    title: Protection & Sealant
    desc: Application de produits de protection écologique pour prolonger la vie de vos installations solaires.
    feature1: Protection 18 mois
    feature2: Réduit salissures
    feature3: Sans silicone
    feature4: Écologique certifié

  service5:
    title: Analyse Performance
    desc: Analyse détaillée du rendement de votre installation avec propositions d'optimisation.
    feature1: Données de production
    feature2: Comparaison normes
    feature3: Plan d'amélioration
    feature4: Suivi mensuel inclus

  service6:
    title: Intervention d'Urgence
    desc: Service d'intervention rapide 24/7 pour toute situation d'urgence ou problème critique.
    feature1: Réponse dans 2 heures
    feature2: Disponibilité 24/7
    feature3: Techniciens expérimentés
    feature4: Tarifs transparents

