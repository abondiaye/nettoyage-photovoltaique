services_page:
  title: I nostri servizi professionali
  subtitle: Scoprite le nostre soluzioni complete di pulizia e manutenzione per pannelli fotovoltaici

  service1:
    title: Pulizia ad alta pressione
    desc: Pulizia professionale con acqua osmotizzata e attrezzature ad alta pressione per rimuovere ogni sporcizia.
    feature1: Acqua osmotizzata al 100%
    feature2: Zero prodotti chimici
    feature3: Tecnologia ecologica
    feature4: Resa garantita +25%

  service2:
    title: Ispezione Completa
    desc: Diagnosi professionale dettagliata dei vostri impianti solari con relazione fotografica completa.
    feature1: Relazione dettagliata inclusa
    feature2: Foto ad alta risoluzione
    feature3: Raccomandazioni personalizzate
    feature4: Gratuito per clienti Sirius

  service3:
    title: Manutenzione Regolare
    desc: Contratti di manutenzione personalizzati per garantire prestazioni ottimali tutto l'anno.
    feature1: Pulizie mensili/trimestrali
    feature2: Monitoraggio in tempo reale
    feature3: Tariffe preferenziali
    feature4: Interventi prioritari

  service4:
    title: Protezione e Sigillatura
    desc: Applicazione di prodotti di protezione ecologica per prolungare la vita dei vostri impianti.
    feature1: Protezione 18 mesi
    feature2: Riduce lo sporco
    feature3: Senza silicone
    feature4: Certificato ecologico

  service5:
    title: Analisi delle Prestazioni
    desc: Analisi dettagliata del rendimento del vostro impianto con proposte di ottimizzazione.
    feature1: Dati di produzione
    feature2: Confronto con i standard
    feature3: Piano di miglioramento
    feature4: Monitoraggio mensile incluso

  service6:
    title: Intervento di Emergenza
    desc: Servizio di intervento rapido 24/7 per situazioni di emergenza o problemi critici.
    feature1: Risposta entro 2 ore
    feature2: Disponibilità 24/7
    feature3: Tecnici esperti
    feature4: Prezzi trasparenti

